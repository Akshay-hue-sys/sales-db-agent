[project]
name = "sales-db-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.3.0",
    "dlt>=1.30.0",
    "duckdb>=1.5.6",
    "fastmcp>=4.0.10",
    "google-genai>=2.25.0",
    "huggingface-hub>=1.33.0",
    "marimo>=0.25.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tokenizers>=0.23.2",
]

[project.scripts]
sales-db-agent = "sales_db_agent:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
